name: Python Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Run test suite and generate run artifact
        id: tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          python -m pytest tests -q > pytest-output.txt 2>&1 || status=$?

          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          artifact_dir = root / 'artifacts'
          artifact_dir.mkdir(exist_ok=True)

          log_path = root / 'pytest-output.txt'
          log_text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''

          summary = ''
          for line in reversed(log_text.splitlines()):
              line = line.strip()
              if not line:
                  continue
              if re.search(r'\b\d+ passed\b|\b\d+ failed\b|\b\d+ error\b', line):
                  summary = line
                  break

          match = re.search(r'(\d+) passed', log_text)
          passed = int(match.group(1)) if match else 0
          match = re.search(r'(\d+) failed', log_text)
          failed = int(match.group(1)) if match else 0
          match = re.search(r'(\d+) error', log_text)
          errors = int(match.group(1)) if match else 0

          artifact = {
              'generated_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'total_runs': 1,
              'passed': passed,
              'failed': failed + errors,
              'summary': {
                  'total': passed + failed + errors,
                  'passed': passed,
                  'failed': failed + errors,
                  'pytest_summary': summary,
              },
              'runs': [{
                  'name': 'pytest-tests',
                  'prompt': 'python -m pytest tests -q',
                  'expected': 'passed',
                  'actual': 'passed' if (failed == 0 and errors == 0) else 'failed',
                  'passed': (failed == 0 and errors == 0),
                  'blocked_at': None,
                  'error': None if (failed == 0 and errors == 0) else log_text.strip()[-2000:],
              }],
          }
          (root / 'artifacts' / 'run_artifact.json').write_text(json.dumps(artifact, indent=2), encoding='utf-8')
          print(json.dumps(artifact['summary'], indent=2))
          PY

          exit $status

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardlab-run-artifact
          path: artifacts/run_artifact.json
          if-no-files-found: error

      - name: Run OWASP input-guard benchmark
        run: |
          python benchmark_guardrails.py \
            --execution-stage input \
            --output-dir artifacts/benchmarks/owasp_llm_1000_ci

      - name: Run expected-outcome guardrail validation
        run: |
          python benchmark_guardrails.py \
            --suite validation \
            --execution-stage input \
            --validation-variants 5 \
            --output-dir artifacts/benchmarks/guardrail_validation_ci

      - name: Upload OWASP benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-llm-1000-benchmark
          path: artifacts/benchmarks/
          if-no-files-found: error
